<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Caméras</title>
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f1f3f4; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  /* L'appli existante (Google Apps Script) est affichée telle quelle, en plein écran */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #aide { position: fixed; left: 8px; bottom: 8px; z-index: 10; background: rgba(32,33,36,.85); color: #fff; font-size: 13px;
          padding: 7px 12px; border-radius: 16px; text-decoration: none; transition: opacity .6s; }
  #aide.cache { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- ============================================================
     Lien de l'appli des techniciens (déploiement Web existant, /exec).
     Si un jour le lien change, ne modifier QUE cette ligne.
     ============================================================ -->
<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbyPQ-Ohiuro0xr3a-uYSgRrZCzu0YYm861jikJoDxG6rWQnLAwlH7Q_Ff-Y5ELv5WHpvQ/exec"
  allow="geolocation *; camera *; clipboard-write *; fullscreen *"
  title="Maintenance Caméras"></iframe>

<!-- Petit lien de secours (disparaît après 8 s) : si la page reste blanche ou demande la connexion Google,
     on ouvre l'appli dans Chrome pour se connecter, puis on revient dans l'appli. -->
<a id="aide" target="_blank" rel="noopener"
   href="https://script.google.com/macros/s/AKfycbyPQ-Ohiuro0xr3a-uYSgRrZCzu0YYm861jikJoDxG6rWQnLAwlH7Q_Ff-Y5ELv5WHpvQ/exec">Page blanche ? Ouvrir dans Chrome ↗</a>
<script>
  setTimeout(function () { document.getElementById('aide').className = 'cache'; }, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
