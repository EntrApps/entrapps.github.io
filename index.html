<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EntrApps</title>
<meta name="apple-mobile-web-app-title" content="EntrApps">
<meta name="application-name" content="EntrApps">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f1f3f4; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  /* L'appli existante (Google Apps Script) est affichée telle quelle, en plein écran */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #aide { position: fixed; left: 8px; bottom: 8px; z-index: 10; background: rgba(32,33,36,.85); color: #fff; font-size: 13px;
          padding: 7px 12px; border-radius: 16px; text-decoration: none; transition: opacity .6s; }
  #aide.cache { opacity: 0; pointer-events: none; }
  /* Bandeau « Activer les notifications » */
  #notif { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 20; width: calc(100% - 24px); max-width: 420px;
           background: #fff; color: #202124; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.3); padding: 12px 14px; box-sizing: border-box;
           align-items: center; gap: 10px; font-size: 14px; }
  #notif .t { flex: 1; line-height: 1.35; }
  #notif button { border: 0; border-radius: 8px; font-size: 14px; padding: 9px 12px; cursor: pointer; }
  #notif .ok { background: #0032A1; color: #fff; font-weight: bold; }
  #notif .non { background: none; color: #5f6368; font-size: 20px; padding: 4px 6px; }
</style>
</head>
<body>
<!-- ============================================================
     Lien de l'appli des techniciens (déploiement Web existant, /exec).
     Si un jour le lien change, ne modifier QUE cette ligne.
     ============================================================ -->
<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbyPQ-Ohiuro0xr3a-uYSgRrZCzu0YYm861jikJoDxG6rWQnLAwlH7Q_Ff-Y5ELv5WHpvQ/exec"
  allow="geolocation *; camera *; clipboard-write *; fullscreen *"
  title="EntrApps"></iframe>

<!-- Petit lien de secours (disparaît après 8 s) : si la page reste blanche ou demande la connexion Google,
     on ouvre l'appli dans Chrome pour se connecter, puis on revient dans l'appli. -->
<a id="aide" target="_blank" rel="noopener"
   href="https://script.google.com/macros/s/AKfycbyPQ-Ohiuro0xr3a-uYSgRrZCzu0YYm861jikJoDxG6rWQnLAwlH7Q_Ff-Y5ELv5WHpvQ/exec">Page blanche ? Ouvrir dans Chrome ↗</a>
<div id="notif"><span style="font-size:22px">🔔</span><span class="t">Recevoir une notification à chaque <b>nouvelle tâche</b> ?</span>
  <button class="ok" id="notifOk" type="button">Activer</button><button class="non" id="notifNon" type="button" aria-label="Plus tard">×</button></div>
<script>
  // Ouverture directe d'une page (ex. notification « Nouvelle tâche » -> ?page=taches)
  (function () {
    var p = new URLSearchParams(location.search).get('page');
    if (p && /^[a-z0-9]+$/.test(p)) {
      var f = document.getElementById('app');
      f.src = f.getAttribute('src').split('?')[0] + '?page=' + p;
    }
  })();
  // Notifications push (OneSignal, appli « Entra Smart Energy App »)
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: '498ee54e-024f-4eab-8d62-b9efe9aa0558',
      serviceWorkerPath: 'sw.js',
      serviceWorkerParam: { scope: '/' }
    });
    if (!OneSignal.Notifications.isPushSupported() || OneSignal.Notifications.permission) return;
    if (window.Notification && Notification.permission === 'denied') return;
    var plusTard = 0;
    try { plusTard = Number(localStorage.getItem('notif_plus_tard') || 0); } catch (e) {}
    if (Date.now() - plusTard < 3 * 24 * 3600 * 1000) return;
    var b = document.getElementById('notif');
    b.style.display = 'flex';
    document.getElementById('notifOk').onclick = function () {
      b.style.display = 'none';
      OneSignal.Notifications.requestPermission();
    };
    document.getElementById('notifNon').onclick = function () {
      b.style.display = 'none';
      try { localStorage.setItem('notif_plus_tard', String(Date.now())); } catch (e) {}
    };
  });
  setTimeout(function () { document.getElementById('aide').className = 'cache'; }, 8000);
  // Navigation interne : l'appli demande (postMessage) d'ouvrir une page dans ce cadre
  // au lieu de quitter l'appli installée pour une page web.
  var APPLI = 'https://script.google.com/macros/s/AKfycbyPQ-Ohiuro0xr3a-uYSgRrZCzu0YYm861jikJoDxG6rWQnLAwlH7Q_Ff-Y5ELv5WHpvQ/';
  window.addEventListener('message', function (e) {
    var u = e.data && e.data.appliAller, h = '';
    try { h = new URL(e.origin).hostname; } catch (err) {}
    if (typeof u !== 'string' || !/\.googleusercontent\.com$/.test(h) || u.indexOf(APPLI) !== 0) return;
    document.getElementById('app').src = u;
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
